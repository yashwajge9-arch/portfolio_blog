<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#12131c"/>
      <stop offset="100%" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with subtle cinematic aperture -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="#262938" stroke-width="2"/>
  
  <!-- Film reel aperture ring -->
  <circle cx="256" cy="256" r="168" stroke="#1f2333" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="128" fill="#131520" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Play triangle glyph with neon amber glow -->
  <polygon points="224,196 224,316 320,256" fill="url(#amberGlow)" filter="url(#glow)"/>

  <!-- Scrubber timeline ticks -->
  <line x1="160" y1="360" x2="352" y2="360" stroke="#33384c" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="360" x2="260" y2="360" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="360" r="7" fill="#fbbf24"/>
</svg>
